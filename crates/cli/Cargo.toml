[package]
name = "ed2k-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Generate ed2k links for whole directory trees without eMule"
build = "build.rs"

[dependencies]
ed2k-vault-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
indicatif = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
